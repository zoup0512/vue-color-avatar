# ============================================================
# vue-color-avatar 托管配置片段
# 部署路径: https://www.razor123.site/avatar/
#
# 用法（一次性配置）:
#   1. 把下面内容粘贴到服务器上你站点的 server { } 块内
#      （即 /etc/nginx/sites-enabled/ 下你域名的那个配置文件，
#       宝塔面板则在 /www/server/panel/vhost/nginx/ 下）
#   2. 服务器执行: nginx -t && systemctl reload nginx
#
# 前提: 目录 /var/www/vue-color-avatar 已存在（deploy.sh 会自动创建）
# 注意: 项目已配置 vite base = '/avatar/'，构建产物资源路径自带前缀，
#       因此不会与站点其他路径冲突。
# ============================================================

# /avatar 不带斜杠时 301 跳转到 /avatar/（防止相对路径解析错乱）
location = /avatar {
    return 301 /avatar/;
}

# AI 生图接口转发到仅监听本机的 Node 服务
location = /avatar/api/generate {
    client_max_body_size 12m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8787/avatar/api/generate;
}

# 其余 API（生图历史列表/清空/历史图片访问）同样转发到 Node 服务
location /avatar/api/ {
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8787;
}

# 项目本体: /avatar/xxx -> /var/www/vue-color-avatar/xxx
location /avatar/ {
    alias /var/www/vue-color-avatar/;
    index index.html;
}

# 静态资源长缓存（文件名带 hash，新版本发布后文件名变化自动生效）
# 注意: 正则 location 不继承上方 alias，必须用命名捕获组指定完整路径
location ~* ^/avatar/(?<file>.+\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?))$ {
    alias /var/www/vue-color-avatar/$file;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}
