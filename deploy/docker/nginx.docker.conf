# vue-color-avatar Docker 版 nginx 配置（独立容器，非腾讯云主站片段）
# 与 deploy/nginx.conf 的差异:
#   1. 监听容器内 80 端口，作为完整 server 块存在
#   2. 静态文件来自镜像内 /usr/share/nginx/html/avatar/
#   3. API 反代指向 compose 内的 api 服务名，而非 127.0.0.1:8787
server {
    listen 80;
    server_name _;

    # 生图请求体含 base64 参考图，放宽上传限制
    client_max_body_size 12m;

    location = /avatar {
        return 301 /avatar/;
    }

    location = /avatar/api/generate {
        client_max_body_size 12m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8787/avatar/api/generate;
    }

    # ^~ 阻止下方静态资源正则 location 抢走 *.png 的历史图片请求
    location ^~ /avatar/api/ {
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8787;
    }

    location /avatar/ {
        alias /usr/share/nginx/html/avatar/;
        index index.html;
    }

    # 静态资源长缓存（文件名带 hash，新版本发布后文件名变化自动生效）
    location ~* ^/avatar/(?<file>.+\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?))$ {
        alias /usr/share/nginx/html/avatar/$file;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
